
services:
  db:
    image: postgres:16-alpine
    container_name: library_db
    environment:
      POSTGRES_DB: management_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gajah
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - library-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d management_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/management_system
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: gajah
    depends_on:
      db:
        condition: service_healthy
    networks:
      - library-net
    restart: on-failure

networks:
  library-net:
    driver: bridge

volumes:
  pgdata:
